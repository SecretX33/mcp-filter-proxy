name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag of the release to publish (e.g. v1.2.3 or 1.2.3).'
        required: true
        type: string
      dry_run:
        description: 'Validate trusted publishing and signed provenance without uploading to npm.'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: 'Git tag of the release to publish (e.g. v1.2.3 or 1.2.3).'
        required: true
        type: string
      dry_run:
        description: 'Validate trusted publishing and signed provenance without uploading to npm.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'SecretX33/mcp-filter-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Sanitize tag
        id: sanitize
        uses: ./.github/actions/sanitize-version
        with:
          version: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install publishing tooling
        run: npm install --global npm@12.2.2 --ignore-scripts --registry=https://registry.npmjs.org

      - name: Check publishing tooling
        run: |
          export NPM_DIRECTORY="$(npm root --global)/npm"
          node --input-type=module -e 'import { loadNpm } from "./.github/scripts/publish.ts"; loadNpm(process.env.NPM_DIRECTORY)'

      - name: Download release asset
        env:
          RELEASE_TAG: ${{ steps.sanitize.outputs.tag }}
          RELEASE_VERSION: ${{ steps.sanitize.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          if ! gh release download "$RELEASE_TAG" --pattern "mcp-filter-proxy-${RELEASE_VERSION}.tgz" --dir "$RUNNER_TEMP/npm-release"; then
            echo "::error::Cannot download mcp-filter-proxy-${RELEASE_VERSION}.tgz from release ${RELEASE_TAG}. Check that the release and its package asset exist."
            exit 1
          fi

      - name: Publish to NPM
        env:
          RELEASE_VERSION: ${{ steps.sanitize.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          export NPM_DIRECTORY="$(npm root --global)/npm"
          export RELEASE_TARBALL="$RUNNER_TEMP/npm-release/mcp-filter-proxy-${RELEASE_VERSION}.tgz"
          node .github/scripts/publish.ts
