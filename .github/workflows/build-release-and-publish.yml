name: Build, Release & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3 or v1.2.3). Leave empty to auto-increment patch from latest tag.'
        required: false
        type: string
      dry_run:
        description: 'Validate trusted publishing and signed provenance without uploading to npm.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'SecretX33/mcp-filter-proxy'
    uses: ./.github/workflows/build-and-release.yml
    with:
      version: ${{ inputs.version }}

  publish:
    if: github.repository == 'SecretX33/mcp-filter-proxy'
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      dry_run: ${{ inputs.dry_run }}
